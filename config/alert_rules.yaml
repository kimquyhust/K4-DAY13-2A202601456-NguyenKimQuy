alerts:
  - name: high_p95_latency
    severity: P2
    condition: p95 latency > 2000 ms duy trì 5 phút
    type: symptom-based
    owner: Nguyễn Văn Quân
    runbook: docs/alerts.md#alert-1
  - name: elevated_error_rate
    severity: P1
    condition: error rate > 2% duy trì 5 phút
    type: symptom-based
    owner: Nguyễn Văn Quân
    runbook: docs/alerts.md#alert-2
  - name: quality_drop
    severity: P3
    condition: mean quality_score < 0.75 duy trì 15 phút
    type: symptom-based
    owner: Nguyễn Văn Quân
    runbook: docs/alerts.md#alert-3

